name: label_harga
description: Aplikasi cetak label harga barang via printer Bluetooth thermal
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management (sama seperti KasirkuPro)
  flutter_riverpod: ^2.5.1

  # Local database
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # Printer Bluetooth thermal + ESC/POS
  print_bluetooth_thermal: ^1.1.5
  esc_pos_utils_plus: ^2.0.4

  # Format angka rupiah
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.16.0

flutter:
  uses-material-design: true
