name: Build APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # Repo hanya berisi lib/ + pubspec.yaml. Perintah ini menambahkan
      # folder android/ jika belum ada, tanpa mengubah lib/ atau pubspec.yaml
      # yang sudah ada. Dijalankan tiap build karena runner selalu baru,
      # jadi tidak perlu di-commit balik ke repo.
      - name: Lengkapi folder android/
        run: flutter create --platforms=android .

      - name: Tambahkan izin Bluetooth
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "BLUETOOTH_CONNECT" "$MANIFEST"; then
            sed -i '/<manifest /a \\
    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\\
    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\\
    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\\
    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\\
    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$MANIFEST"
          fi

      - name: Ambil dependency
        run: flutter pub get

      - name: Generate kode Drift
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: label-harga-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Buat GitHub Release (hanya saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
